ng-top:50px}.nav{display:flex;justify-content:space-between;gap:8px;background:var(--nav-bg);color:var(--nav-text);padding:13px 10px;margin:9px 0 16px;font-size:9px;font-weight:bold;letter-spacing:.025em}.hero{height:175px;position:relative;overflow:hidden;background:#151515;border-bottom:4px solid var(--accent)}.hero img{width:100%;height:100%;object-fit:cover;filter:grayscale(1);display:block}.overlay{position:absolute;top:10px;right:10px;left:10px;background:#080808d9;color:#fff;padding:12px;display:flex;justify-content:space-between;gap:6px;align-items:center}.playing{font-size:8px;color:var(--on-dark);font-weight:bold;letter-spacing:.04em;margin-bottom:5px}.track{font-size:14px;font-weight:bold;line-height:1.1}.play{display:grid;place-items:center;width:34px;height:34px;flex-shrink:0;border-radius:50%;background:var(--accent);color:var(--on-accent);font-size:14px}.section-heading{display:flex;align-items:center;gap:14px;margin:23px 0 13px}.section-heading h3{color:var(--heading);font:700 25px/1 Panorama,Helvetica,sans-serif;letter-spacing:-.04em;margin:0 0 0 auto}.cutout{height:25px;width:54px;background:var(--accent);clip-path:polygon(0 28%,33% 0,43% 38%,87% 9%,100% 55%,65% 100%,54% 64%,8% 87%);flex-shrink:0}.track-row{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);padding:12px 0}.album{width:39px;height:39px;background:var(--panel);color:var(--heading);display:grid;place-items:center;font-size:21px}.track-row strong{font-size:12px;display:block}.track-row small{font-size:10px;color:var(--muted);display:block;margin-top:4px}.row-time{margin-left:auto;font-size:9px;color:var(--muted);white-space:nowrap}.room{border:1px solid var(--line);border-top:3px solid var(--accent);background:var(--panel);border-radius:13px;overflow:hidden;margin-top:21px}.room-header{display:flex;align-items:center;gap:9px;padding:12px;border-bottom:1px solid var(--line)}.avatar{width:30px;height:30px;background:var(--accent);color:var(--on-accent);border-radius:50%;display:grid;place-items:center;font:700 20px Panorama,sans-serif}.room-header strong{font-size:12px}.room-header small{display:block;color:var(--muted);font-size:9px;margin-top:3px}.messages{padding:13px;display:flex;flex-direction:column;gap:13px;font-size:11px;line-height:1.4}.msg{max-width:86%;align-self:flex-start}.msg small{display:block;color:var(--muted);font-size:8px;margin:0 2px 5px}.msg p{margin:0;padding:10px 12px;background:var(--bubble);color:var(--text);border-radius:12px 12px 12px 2px}.msg.own{align-self:flex-end}.msg.own small{text-align:right}.msg.own p{background:var(--own);color:var(--on-own);border-radius:12px 12px 2px 12px}.compose{margin:0 12px 12px;padding:6px 7px 6px 12px;border:1px solid var(--line);border-radius:24px;display:flex;align-items:center;justify-content:space-between;font-size:10px;color:var(--muted);gap:5px}.send{width:28px;height:28px;display:grid;place-items:center;background:var(--own);color:var(--on-own);border-radius:50%;font-size:15px}.ribbon{background:var(--accent);color:var(--on-accent);padding:17px 20px;margin-top:23px;clip-path:polygon(4% 0,34% 0,38% 19%,73% 0,97% 0,100% 50%,96% 100%,65% 100%,61% 80%,33% 100%,3% 100%,0 50%);text-align:center;font-size:10px;font-weight:bold}.copyright{color:var(--on-frame);padding:13px 0;text-align:center;font-size:9px}.note{max-width:1500px;margin:25px auto 0;font-size:11px;color:#666}.a{--frame:#e6bccb;--on-frame:#5a1737;--surface:#5a1737;--text:#f5ede5;--muted:#d6b4c3;--logo-bg:#f5ede5;--logo-text:#5a1737;--nav-bg:#e6bccb;--nav-text:#5a1737;--accent:#e6bccb;--on-accent:#5a1737;--on-dark:#e6bccb;--heading:#e6bccb;--panel:#43112a;--line:#8e516a;--bubble:#702341;--own:#e6bccb;--on-own:#5a1737}
.b{--frame:#183d32;--on-frame:#f1ead8;--surface:#f1ead8;--text:#19362e;--muted:#59655c;--logo-bg:#183d32;--logo-text:#f1ead8;--nav-bg:#dce0cd;--nav-text:#183d32;--accent:#a5412d;--on-accent:#fff;--on-dark:#f1ead8;--heading:#183d32;--panel:#faf7ef;--line:#c9cbb9;--bubble:#e6e9db;--own:#183d32;--on-own:#fff}
.c{--frame:#f89c65;--on-frame:#302039;--surface:#302039;--text:#f5eaf5;--muted:#c7b2ca;--logo-bg:#dcc5e3;--logo-text:#302039;--nav-bg:#51365d;--nav-text:#f5eaf5;--accent:#f89c65;--on-accent:#302039;--on-dark:#f89c65;--heading:#dcc5e3;--panel:#24172b;--line:#62456e;--bubble:#493151;--own:#f89c65;--on-own:#302039}
.d{--frame:#cb3b32;--on-frame:#fff;--surface:#191919;--text:#f4efe8;--muted:#b8b2aa;--logo-bg:#f4efe8;--logo-text:#191919;--nav-bg:#cb3b32;--nav-text:#fff;--accent:#cb3b32;--on-accent:#fff;--on-dark:#f3a29a;--heading:#f4efe8;--panel:#242424;--line:#484442;--bubble:#373330;--own:#cb3b32;--on-own:#fff}
@media(max-width:950px){body{padding:24px 16px}.grid{grid-template-columns:1fr;max-width:520px;gap:30px}.logo{font-size:48px}.page-head{align-items:start;flex-direction:column}.site{min-height:0}.intro{max-width:none}.toolbar{gap:6px}.toolbar button{font-size:11px;padding:8px 12px}}
.logo{font-size:clamp(28px,3.8vw,54px)}.grid{max-width:1100px}.site{min-height:744px}@media(max-width:950px){.logo{font-size:clamp(28px,8vw,48px)}}
</style></head><body>
<header class="page-head"><div><p class="eyebrow">PANORAMA / DIRECCIÓN DE COLOR</p><h1>Cuatro formas de sonar.</h1></div><p class="intro">Vino, bosque, berenjena y grafito.<br>Cuatro paletas para una radio indie con personalidad artística.</p></header>
<nav class="toolbar" aria-label="Elegir propuesta"><button data-palette="all" aria-pressed="true">Comparar las cuatro</button><button data-palette="a" aria-pressed="false">01 · Vino y rosa</button><button data-palette="b" aria-pressed="false">02 · Bosque y crema</button><button data-palette="c" aria-pressed="false">03 · Berenjena y naranja</button><button data-palette="d" aria-pressed="false">04 · Grafito y rojo</button></nav>
<main class="grid" id="proposals"></main><p class="note">Vista de diseño con mensajes y títulos ilustrativos. La web publicada no se ha modificado. Selecciona una propuesta para verla ampliada.</p>
<script>
const palettes=[
 {id:'a',name:'01 / Vino y rosa',colors:[['#5A1737','#fff'],['#E6BCCB','#5a1737'],['#F5EDE5','#5a1737'],['#43112A','#fff']],description:'Vino profundo, rosa empolvado y marfil. Íntima, sofisticada y con carácter editorial.',recommended:true},
 {id:'b',name:'02 / Bosque y crema',colors:[['#183D32','#fff'],['#F1EAD8','#183d32'],['#A5412D','#fff'],['#DCE0CD','#183d32']],description:'Verde bosque, crema y terracota. Cálida y analógica, con aire de tienda de discos.'},
 {id:'c',name:'03 / Berenjena y naranja',colors:[['#302039','#fff'],['#F89C65','#302039'],['#DCC5E3','#302039'],['#24172B','#fff']],description:'Berenjena, naranja durazno y lila. Nocturna, inesperada y cercana al arte contemporáneo.'},
 {id:'d',name:'04 / Grafito y rojo',colors:[['#191919','#fff'],['#CB3B32','#fff'],['#F4EFE8','#191919'],['#373330','#fff']],description:'Grafito, rojo y blanco hueso. Directa, musical y con fuerza de cartel independiente.'}
];
const grid=document.getElementById('proposals');
for(const p of palettes){const card=document.createElement('article');card.className='proposal '+p.id;card.dataset.palette=p.id;
card.innerHTML=`<div class="proposal-label"><h2>${p.name}</h2>${p.recommended?'<span class="recommend">MI PROPUESTA</span>':''}</div><div class="swatches">${p.colors.map(([bg,fg])=>`<span class="swatch" style="background:${bg};color:${fg}">${bg}</span>`).join('')}</div><div class="preview"><div class="site"><div class="logo">PANORAMA</div><div class="nav"><span>SOBRE</span><span>MERCH</span><span>PROGRAMACIÓN</span><span>CHAT ↗</span></div><div class="hero"><img src="../assets/img/radio.gifv" alt="Radio portátil en blanco y negro"><div class="overlay"><div><div class="playing">SONANDO AHORA</div><div class="track">Música para<br>escuchar distinto.</div></div><span class="play" aria-hidden="true">▶</span></div></div><div class="section-heading"><span class="cutout" aria-hidden="true"></span><h3>recién sonaron_</h3></div><div class="track-row"><span class="album" aria-hidden="true">♫</span><div><strong>Una nueva canción</strong><small>Artista independiente</small></div><span class="row-time">22:08</span></div><div class="room"><div class="room-header"><span class="avatar">P</span><div><strong>Chat de oyentes</strong><small>La sala de PANORAMA</small></div></div><div class="messages"><div class="msg"><small>Andrea · 22:10</small><p>Esta canción se queda conmigo.</p></div><div class="msg own"><small>Tú · 22:11</small><p>De esas que quieres escuchar otra vez ♡</p></div></div><div class="compose"><span>Súmate a la conversación…</span><span class="send" aria-hidden="true">↗</span></div></div><div class="ribbon">OTRAS FORMAS DE ESCUCHAR</div></div><div class="copyright">© 2026 PANORAMA</div></div><p class="explanation">${p.description}</p>`;grid.append(card)}
for(const button of document.querySelectorAll('.toolbar button'))button.addEventListener('click',()=>{const selected=button.dataset.palette;grid.classList.toggle('single',selected!=='all');for(const card of grid.children)card.hidden=selected!=='all'&&card.dataset.palette!==selected;for(const b of document.querySelectorAll('.toolbar button'))b.setAttribute('aria-pressed',String(b===button));});
</script></body></html>
