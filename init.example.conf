; Copia este archivo como init.conf y completa los datos de tu instalación.
[site]
name = "PANORAMA"
url = "http://localhost"
theme = "default"
base_url = "/miradio"

[db]
host = "127.0.0.1"
name = "radio_db"
user = "radio_user"
pass = ""
charset = "utf8mb4"

[icecast]
stream_host = "127.0.0.1"
stream_port = 8000
mount = "/stream"
status_url = "http://127.0.0.1:8000/status-json.xsl"
status_user = ""
status_pass = ""

[cache]
now_playing_ttl = 5

[radiodj]
database_settings = "C:/RadioDJv3/settings_database.xml"
timezone = "America/Mexico_City"
now_playing_file = "C:/RadioDJv3/NowPlaying.txt"
